name: Publish careers site
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh vacancies
        run: python3 scripts/update-jobs.py
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - run: sh scripts/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
